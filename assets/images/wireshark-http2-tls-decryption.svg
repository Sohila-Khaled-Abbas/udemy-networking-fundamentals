<rect x="32" y="28" width="936" height="4" rx="2" fill="url(#glow)"/>
<text x="56" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f3f7ff">HTTP/2 over TLS: decrypt your own test session</text>
<text x="56" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#a7b7d0">Browser session secrets let Wireshark decode traffic from an authorized capture.</text>
