<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="480" viewBox="0 0 1000 480" role="img" aria-labelledby="title desc">
<title id="title">HTTP/2 over TLS: decrypt your own test session</title><desc id="desc">Browser session secrets let Wireshark decode traffic from an authorized capture.</desc>
