 <rect x="752" y="158" width="192" height="126" rx="18" fill="#15243a" stroke="#3f5577" stroke-width="1.5"/> <text x="848" y="192" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f3f7ff" text-anchor="middle">WIRESHARK</text> <text x="848" y="218" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a7b7d0" text-anchor="middle">TLS key log</text> <rect x="786" y="236" width="124" height="28" rx="8" fill="#203a38" stroke="#3c8e79" stroke-width="1.5"/> <text x="848" y="255" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#65e6c1" text-anchor="middle">decrypt</text>
