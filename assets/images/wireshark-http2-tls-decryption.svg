 <rect x="399" y="238" width="200" height="28" rx="8" fill="#2d2544" stroke="#6e65aa" stroke-width="1.5"/> <text x="499" y="257" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#b7a0ff" text-anchor="middle">ciphertext</text>
