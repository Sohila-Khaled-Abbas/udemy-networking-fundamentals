 <rect x="704" y="323" width="240" height="78" rx="15" fill="#172d31" stroke="#3c8e79" stroke-width="1.5"/> <text x="824" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#f3f7ff" text-anchor="middle">HTTP/2 frames</text> <text x="824" y="375" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#a7b7d0" text-anchor="middle">headers • streams • data</text>
 <rect x="56" y="323" width="590" height="78" rx="15" fill="#211e32" stroke="#6e65aa" stroke-width="1.5"/> <text x="80" y="352" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#b7a0ff" text-anchor="start">KEY-LOG SAFETY</text> <text x="80" y="378" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#f3f7ff" text-anchor="start">Use only your own test session; the log can reveal captured session contents.</text>
 <text x="56" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#a7b7d0" text-anchor="start">Without matching session secrets, Wireshark can usually show TLS metadata—not HTTP/2 plaintext.</text>
