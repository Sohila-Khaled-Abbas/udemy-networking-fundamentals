<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="460" viewBox="0 0 1000 460" role="img" aria-labelledby="title desc">
<title id="title">MongoDB packet inspection</title><desc id="desc">A host client reaches a disposable MongoDB container through a loopback-published port.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101f34"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#51d5ef" stop-opacity=".2"/><stop offset="1" stop-color="#b7a0ff" stop-opacity=".03"/></linearGradient></defs>
<rect width="1000" height="460" rx="26" fill="url(#bg)"/>
<circle cx="930" cy="58" r="110" fill="#b7a0ff" opacity=".055"/><circle cx="85" cy="445" r="145" fill="#51d5ef" opacity=".045"/>
<rect x="32" y="28" width="936" height="4" rx="2" fill="url(#glow)"/>
<text x="56" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f3f7ff">MongoDB packet inspection</text>
<text x="56" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#a7b7d0">A host client reaches a disposable MongoDB container through a loopback-published port.</text>
<rect x="56" y="153" width="200" height="119" rx="18" fill="#15243a" stroke="#3f5577" stroke-width="1.5"/> <text x="156" y="187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f3f7ff" text-anchor="middle">HOST CLIENT</text> <text x="156" y="211" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#a7b7d0" text-anchor="middle">mongosh / Compass</text> <text x="156" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#65e6c1" text-anchor="middle">127.0.0.1:27017</text>
 <line x1="257" y1="214" x2="366" y2="214" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" /><path d="M 357 208 L 366 214 L 357 220" fill="none" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <text x="311" y="197" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#65e6c1" text-anchor="middle">published port</text>
 <rect x="366" y="153" width="268" height="119" rx="18" fill="#172d31" stroke="#3c8e79" stroke-width="1.5"/> <text x="500" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f3f7ff" text-anchor="middle">DOCKER PORT MAP</text> <text x="500" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#65e6c1" text-anchor="middle">127.0.0.1:27017</text> <text x="500" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a7b7d0" text-anchor="middle">→ container :27017</text>
 <line x1="635" y1="214" x2="744" y2="214" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" /><path d="M 735 208 L 744 214 L 735 220" fill="none" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="744" y="153" width="200" height="119" rx="18" fill="#15243a" stroke="#3f5577" stroke-width="1.5"/> <text x="844" y="187" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f3f7ff" text-anchor="middle">MONGOD</text> <text x="844" y="211" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a7b7d0" text-anchor="middle">wire protocol</text> <text x="844" y="240" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#7aa9ff" text-anchor="middle">dissector if supported</text>
 <rect x="56" y="309" width="888" height="104" rx="16" fill="#101d30" stroke="#293b57" stroke-width="1.5"/> <text x="80" y="339" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#a7b7d0" text-anchor="start">CAPTURE CHECKPOINTS</text> <text x="80" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#f3f7ff" text-anchor="start">Identify the TCP flow first, then check whether Wireshark decodes MongoDB messages.</text> <rect x="80" y="381" width="172" height="23" rx="7" fill="#0a1422" stroke="#394e6d" stroke-width="1.5"/> <text x="166" y="397" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#65e6c1" text-anchor="middle">tcp.port == 27017</text> <text x="278" y="397" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#ffbf69" text-anchor="start">Loopback only • disposable data • no real credentials</text>
<text x="56" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#7e91ad">NETWORKING FUNDAMENTALS • HANDS-ON LAB NOTEBOOK</text>
</svg>