<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
<title id="title">Server-Sent Events (SSE) over HTTP</title><desc id="desc">Observe one open HTTP response carrying multiple text events.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101f34"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#51d5ef" stop-opacity=".2"/><stop offset="1" stop-color="#b7a0ff" stop-opacity=".03"/></linearGradient></defs>
<rect width="1000" height="470" rx="26" fill="url(#bg)"/>
<circle cx="930" cy="58" r="110" fill="#b7a0ff" opacity=".055"/><circle cx="85" cy="455" r="145" fill="#51d5ef" opacity=".045"/>
<rect x="32" y="28" width="936" height="4" rx="2" fill="url(#glow)"/>
<text x="56" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f3f7ff">Server-Sent Events (SSE) over HTTP</text>
<text x="56" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#a7b7d0">Observe one open HTTP response carrying multiple text events.</text>
<rect x="56" y="152" width="210" height="104" rx="18" fill="#15243a" stroke="#3f5577" stroke-width="1.5"/> <text x="161" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f3f7ff" text-anchor="middle">CLIENT</text> <text x="161" y="211" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a7b7d0" text-anchor="middle">curl.exe -N</text> <text x="161" y="237" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#51d5ef" text-anchor="middle">GET /events</text>
 <line x1="268" y1="206" x2="424" y2="206" stroke="#51d5ef" stroke-width="3" stroke-linecap="round" /><path d="M 415 200 L 424 206 L 415 212" fill="none" stroke="#51d5ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <text x="347" y="188" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#51d5ef" text-anchor="middle">request</text>
 <rect x="424" y="152" width="250" height="104" rx="18" fill="#172d31" stroke="#3c8e79" stroke-width="1.5"/> <text x="549" y="185" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#f3f7ff" text-anchor="middle">HTTP 200 OK</text> <text x="549" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#65e6c1" text-anchor="middle">text/event-stream</text> <text x="549" y="236" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="400" fill="#a7b7d0" text-anchor="middle">response stays open</text>
 <line x1="676" y1="206" x2="735" y2="206" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" /><path d="M 726 200 L 735 206 L 726 212" fill="none" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
 <rect x="735" y="146" width="209" height="224" rx="18" fill="#17263d" stroke="#3f5577" stroke-width="1.5"/> <text x="839" y="177" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#f3f7ff" text-anchor="middle">EVENT STREAM</text>
 <rect x="754" y="192" width="171" height="43" rx="8" fill="#203b39" stroke="#3c8e79" stroke-width="1.5"/> <text x="839" y="210" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#65e6c1" text-anchor="middle">id: 1</text> <text x="839" y="226" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#f3f7ff" text-anchor="middle">data: message 1</text>
 <rect x="754" y="243" width="171" height="43" rx="8" fill="#203b39" stroke="#3c8e79" stroke-width="1.5"/> <text x="839" y="261" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" fill="#65e6c1" text-anchor="middle">id: 2</text> <text x="839" y="277" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="500" fill="#f3f7ff" text-anchor="middle">data: message 2</text>
 <text x="839" y="315" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700" fill="#a7b7d0" text-anchor="middle">⋮</text> <text x="839" y="346" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#a7b7d0" text-anchor="middle">more events</text>
 <rect x="56" y="306" width="618" height="91" rx="16" fill="#101d30" stroke="#293b57" stroke-width="1.5"/> <text x="80" y="336" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" fill="#a7b7d0" text-anchor="start">BOUNDARY MATTERS</text> <text x="80" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="500" fill="#f3f7ff" text-anchor="start">Blank lines delimit SSE events; TCP packets may split or combine those bytes.</text>
 <text x="56" y="431" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="500" fill="#a7b7d0" text-anchor="start">SSE uses HTTP as its transport. One response can deliver many events over time.</text>
<text x="56" y="446" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#7e91ad">NETWORKING FUNDAMENTALS • HANDS-ON LAB NOTEBOOK</text>
</svg>