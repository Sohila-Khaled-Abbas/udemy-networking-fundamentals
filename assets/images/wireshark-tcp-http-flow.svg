<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc">
<title id="title">TCP + HTTP: read the conversation</title><desc id="desc">The TCP handshake proves transport establishment—not application success.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#101f34"/></linearGradient><linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#51d5ef" stop-opacity=".2"/><stop offset="1" stop-color="#b7a0ff" stop-opacity=".03"/></linearGradient></defs>
<rect width="1000" height="520" rx="26" fill="url(#bg)"/>
<circle cx="930" cy="58" r="110" fill="#b7a0ff" opacity=".055"/><circle cx="85" cy="505" r="145" fill="#51d5ef" opacity=".045"/>
<rect x="32" y="28" width="936" height="4" rx="2" fill="url(#glow)"/>
<text x="56" y="76" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="#f3f7ff">TCP + HTTP: read the conversation</text>
<text x="56" y="108" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" fill="#a7b7d0">The TCP handshake proves transport establishment—not application success.</text>
<rect x="56" y="147" width="200" height="82" rx="16" fill="#15243a" stroke="#3f5577" stroke-width="1.5"/> <text x="156" y="179" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f3f7ff" text-anchor="middle">CLIENT</text> <text x="156" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a7b7d0" text-anchor="middle">curl.exe</text>
 <rect x="744" y="147" width="200" height="82" rx="16" fill="#15243a" stroke="#3f5577" stroke-width="1.5"/> <text x="844" y="179" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#f3f7ff" text-anchor="middle">HTTP SERVER</text> <text x="844" y="204" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="400" fill="#a7b7d0" text-anchor="middle">Node.js :8080</text>
 <text x="65" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#51d5ef" text-anchor="start">CLIENT → SERVER</text> <text x="755" y="268" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" fill="#65e6c1" text-anchor="start">SERVER → CLIENT</text>
 <line x1="258" y1="286" x2="742" y2="286" stroke="#7aa9ff" stroke-width="3" stroke-linecap="round" /><path d="M 733 280 L 742 286 L 733 292" fill="none" stroke="#7aa9ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <text x="500" y="276" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#7aa9ff" text-anchor="middle">SYN</text>
 <line x1="742" y1="326" x2="258" y2="326" stroke="#b7a0ff" stroke-width="3" stroke-linecap="round" /><path d="M 267 320 L 258 326 L 267 332" fill="none" stroke="#b7a0ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <text x="500" y="316" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#b7a0ff" text-anchor="middle">SYN / ACK</text>
 <line x1="258" y1="366" x2="742" y2="366" stroke="#51d5ef" stroke-width="3" stroke-linecap="round" /><path d="M 733 360 L 742 366 L 733 372" fill="none" stroke="#51d5ef" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <text x="500" y="356" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#51d5ef" text-anchor="middle">ACK</text>
 <line x1="258" y1="406" x2="742" y2="406" stroke="#ffbf69" stroke-width="3" stroke-linecap="round" /><path d="M 733 400 L 742 406 L 733 412" fill="none" stroke="#ffbf69" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <text x="500" y="396" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#ffbf69" text-anchor="middle">GET / HTTP/1.1</text>
 <line x1="742" y1="446" x2="258" y2="446" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" /><path d="M 267 440 L 258 446 L 267 452" fill="none" stroke="#65e6c1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/> <text x="500" y="436" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" fill="#65e6c1" text-anchor="middle">HTTP/1.1 200 OK + body</text>
 <text x="56" y="480" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#a7b7d0" text-anchor="start">TCP carries an ordered byte stream; HTTP messages do not have to match packet boundaries.</text>
<text x="56" y="496" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" fill="#7e91ad">NETWORKING FUNDAMENTALS • HANDS-ON LAB NOTEBOOK</text>
</svg>